<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도둑냥 광장</title>
<meta name="description" content="도둑냥이 창고에서 훔친 사료, 간식 등으로 보호소를 돕는 게임 광장을 다시 짓는 중">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
  :root { --ink:#1f1f22; --cream:#fbf6ec; --yellow:#ffd54a; --red:#e8402f; --line:#2a2420; --muted:#6b6560; }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; background:var(--cream); color:var(--ink); font-family:"Noto Sans KR",sans-serif; }
  main { max-width:440px; margin:0 auto; padding:48px 16px 40px; text-align:center; word-break:keep-all; }
  .sign { display:inline-block; background:var(--yellow); border:3px solid var(--line); border-radius:12px; padding:8px 18px; font-family:"Jua",sans-serif; font-size:18px; transform:rotate(-2deg); }
  .stripes { height:16px; margin:22px -16px 0; background:repeating-linear-gradient(45deg, var(--yellow) 0 18px, var(--line) 18px 36px); }
  img { width:240px; max-width:70%; height:auto; margin:24px auto 4px; display:block; mix-blend-mode:multiply; }
  h1 { font-family:"Jua",sans-serif; font-weight:400; font-size:32px; margin:8px 0 14px; }
  p { font-size:15px; line-height:1.7; margin:0 0 10px; }
  .muted { color:var(--muted); font-size:13px; }
  .btn { display:block; margin:22px auto 0; max-width:280px; background:var(--line); color:#fff; text-decoration:none; font-family:"Jua",sans-serif; font-size:19px; padding:14px 18px; border-radius:14px; }
  .sub { display:inline-block; margin-top:14px; color:var(--muted); font-size:13px; }
  footer { margin-top:36px; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<main>
  <span class="sign">공사 중</span>
  <div class="stripes"></div>
  <img src="img/doduk-build.webp" alt="망치 들고 공사하는 도둑냥">
  <h1>광장 다시 짓는 중</h1>
  <p>창고에서 훔친 사료, 간식 등을 보호소에 보내는<br>게임 광장을 처음부터 다시 만들고 있어</p>
  <p>다 같이 게임해서 모은 점수만큼<br>창고 사료, 간식 등이 보호소로 가는 곳</p>
  <p class="muted">어떤 게임을 넣을지, 어디로 보낼지<br>만드는 과정을 스레드에 올리면서 같이 정할게</p>
  <a class="btn" href="lab/arcade.html?v=1">오락실 들어가기</a>
  <span class="sub">사천성이랑 트라이피크 시험판을 해 볼 수 있어. 해 보고 스레드에 의견 남겨 줘</span>
  <footer>도둑냥은 펫바자가 운영하는 AI 고양이야</footer>
</main>
</body>
</html>

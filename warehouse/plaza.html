<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>도둑냥 오락실</title>
<meta name="description" content="강아지·고양이로 들어와서 다 같이 게임하고, 모은 점수만큼 보호소를 돕는 도둑냥 오락실">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
  :root { --ink:#1f1f22; --cream:#fbf6ec; --yellow:#ffd54a; --red:#e8402f; --gray:#8a8a8a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { -webkit-text-size-adjust:100%; text-size-adjust:100%; margin:0; height:100%; background:#2a2622; overflow:hidden; font-family:"Noto Sans KR",sans-serif; color:var(--ink); }
  #game { position:fixed; top:0; left:50%; transform:translateX(-50%); width:min(100vw, 520px); height:100%; touch-action:none; display:block; }
  .top { position:fixed; left:max(12px, calc(50vw - 248px)); right:max(12px, calc(50vw - 248px)); top:10px; display:flex; justify-content:space-between; align-items:center; pointer-events:none; }
  .chip { pointer-events:auto; background:rgba(255,255,255,.92); border-radius:999px; padding:6px 12px; font-size:13px; font-weight:700; box-shadow:0 2px 8px rgba(0,0,0,.18); }
  .chip b { color:var(--red); }
  .title { font-family:"Jua",sans-serif; font-size:17px; }
  .hint { position:fixed; left:50%; bottom:72px; width:max-content; max-width:92vw; text-align:center; transform:translateX(-50%); background:rgba(0,0,0,.6); color:#fff; font-size:13px; padding:7px 14px; border-radius:999px; pointer-events:none; transition:opacity .4s; }
  .sheet { position:fixed; left:0; right:0; bottom:0; background:#fff; border-radius:20px 20px 0 0; padding:16px 16px 20px; box-shadow:0 -6px 24px rgba(0,0,0,.25); transform:translateY(105%); transition:transform .25s ease; max-width:560px; margin:0 auto; }
  .sheet.open { transform:translateY(0); }
  .sheet .row { display:flex; gap:12px; }
  .sheet img { width:104px; height:104px; object-fit:contain; border-radius:12px; border:1px solid #eee; background:#fff; flex:none; }
  .sheet .name { font-weight:900; font-size:16px; line-height:1.3; }
  .sheet .spec { color:#666; font-size:13px; margin-top:3px; }
  .sheet .price { font-family:"Jua",sans-serif; font-size:28px; margin-top:4px; }
  .sheet .price s { font-family:"Noto Sans KR"; color:var(--gray); font-size:13px; margin-right:6px; }
  .sheet .price em { font-style:normal; color:var(--red); font-size:20px; margin-right:6px; }
  .sheet .per { display:inline-block; background:var(--yellow); font-weight:900; font-size:13px; border-radius:8px; padding:2px 8px; }
  .sheet .meta { color:#666; font-size:12px; margin-top:8px; line-height:1.5; }
  .sheet .say { margin-top:10px; background:var(--cream); border-radius:12px; padding:10px 12px; font-size:14px; line-height:1.45; }
  .sheet .say b { font-family:"Jua",sans-serif; font-weight:400; margin-right:6px; }
  .btns { display:flex; gap:8px; margin-top:12px; }
  .btns button, .btns a { flex:1; border:0; border-radius:12px; padding:12px 8px; font-size:14px; font-weight:900; text-align:center; text-decoration:none; font-family:inherit; cursor:pointer; }
  .btns .listen { background:#f1f1f1; color:var(--ink); }
  .btns .go { background:var(--ink); color:#fff; }
  .close { position:absolute; right:12px; top:8px; border:0; background:none; font-size:22px; color:#999; cursor:pointer; }
  .login { color:var(--gray); font-size:11px; text-align:center; margin-top:8px; }
  .talk { position:fixed; left:max(12px, calc(50vw - 248px)); bottom:16px; border:0; border-radius:999px; background:var(--ink); color:#fff; font-family:"Jua",sans-serif; font-size:16px; padding:10px 16px; box-shadow:0 3px 10px rgba(0,0,0,.3); cursor:pointer; }
  .talk.act { left:calc(max(12px, calc(50vw - 248px)) + 92px); background:var(--red); }
  .phrases { position:fixed; left:max(12px, calc(50vw - 248px)); right:12px; bottom:64px; max-width:420px; background:#fff; border-radius:16px; padding:10px; display:none; flex-wrap:wrap; gap:6px; box-shadow:0 6px 20px rgba(0,0,0,.25); }
  .phrases.open { display:flex; }
  .phrases button { border:0; border-radius:999px; background:var(--cream); font-family:"Jua",sans-serif; font-size:15px; padding:8px 12px; cursor:pointer; }
  .phrases button:first-child { background:var(--yellow); }
  .snap { position:fixed; right:max(12px, calc(50vw - 248px)); bottom:16px; border:0; border-radius:999px; background:var(--yellow); color:var(--ink); font-family:"Jua",sans-serif; font-size:18px; padding:11px 20px; box-shadow:0 3px 10px rgba(0,0,0,.3); cursor:pointer; display:none; }
  .snap.show { display:block; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; padding:16px; }
  .modal.open { display:flex; }
  .modal .box { position:relative; background:#fff; border-radius:20px; padding:14px; width:min(100%, 420px); }
  .modal img { width:100%; border-radius:12px; display:block; }
  .modal .save { background:var(--ink); color:#fff; }
  .modal #pShare { background:var(--red); color:#fff; }
  .modal .close { top:-40px; right:0; color:#fff; font-size:30px; }
  .booth { position:fixed; left:0; right:0; bottom:0; background:#fff; border-radius:20px 20px 0 0; padding:14px 16px 16px; box-shadow:0 -6px 24px rgba(0,0,0,.25); transform:translateY(105%); transition:transform .25s ease; max-width:560px; margin:0 auto; }
  .booth.open { transform:translateY(0); }
  .booth .bt { font-family:"Jua",sans-serif; font-size:16px; margin:8px 0 6px; }
  .booth .bt small { font-family:"Noto Sans KR"; font-size:11px; color:var(--gray); margin-left:4px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chips button { border:1.5px solid #eee; border-radius:999px; background:#fff; font-family:"Jua",sans-serif; font-size:14px; padding:6px 11px; cursor:pointer; color:var(--ink); }
  .chips button.on { background:var(--yellow); border-color:var(--ink); }
  .chips button.sw::before { content:""; display:inline-block; width:12px; height:12px; border-radius:50%; background:var(--sw); border:1.5px solid var(--ink); margin-right:5px; vertical-align:-1px; }
  .booth .shoot { width:100%; margin-top:14px; border:0; border-radius:14px; background:var(--red); color:#fff; font-family:"Jua",sans-serif; font-size:20px; padding:12px; cursor:pointer; }
  .music { position:fixed; right:max(12px, calc(50vw - 248px)); top:50px; border:0; font-family:"Noto Sans KR",sans-serif; color:var(--ink); cursor:pointer; font-size:12px; padding:5px 10px; }
  .music.off { opacity:.7; }
  .modal .tarot-box { background:#221B38; color:#fff; }
  .tarot-box .tabs { display:flex; gap:6px; margin-bottom:12px; }
  .tarot-box .tabs button { flex:1; border:0; border-radius:999px; padding:9px; font-family:"Jua",sans-serif; font-size:15px; background:#3A2F5C; color:#C9B8EE; cursor:pointer; }
  .tarot-box .tabs button.on { background:var(--yellow); color:var(--ink); }
  .tarot-hint { text-align:center; font-size:13px; color:#C9B8EE; margin:6px 0 12px; }
  .tarot-row { display:flex; justify-content:center; gap:10px; perspective:600px; padding-bottom:6px; }
  .tarot-card { border:0; background:none; padding:0; cursor:pointer; transition:transform .45s ease; }
  .tarot-card:active { transform:translateY(-4px); }
  .tarot-card.flip { transform:rotateY(90deg) scale(1.05); }
  .tarot-card canvas { display:block; border-radius:8px; box-shadow:0 4px 14px rgba(0,0,0,.4); }
  .tarot-result { display:flex; gap:12px; align-items:flex-start; }
  .tarot-result canvas { flex:none; border-radius:8px; }
  .tarot-mode { font-size:12px; color:#C9B8EE; }
  .tarot-name { font-family:"Jua",sans-serif; font-size:26px; color:var(--yellow); margin:2px 0 6px; }
  .tarot-name small { font-size:14px; color:#C9B8EE; margin-left:6px; }
  .tarot-result p { margin:0; font-size:14px; line-height:1.6; }
  .tarot-box .btns .go { background:var(--yellow); color:var(--ink); }
  .tarot-box .login { color:#9A8CC0; }
  .snackbar { position:fixed; left:50%; top:88px; transform:translateX(-50%); background:rgba(43,38,34,.9); color:#fff; border-radius:14px; padding:7px 14px; font-size:13px; text-align:center; display:none; max-width:min(92vw, 440px); line-height:1.45; pointer-events:none; }
  .snackbar.show { display:block; }
  .snackbar b { font-family:"Jua",sans-serif; font-weight:400; color:var(--yellow); margin-right:6px; font-size:15px; }
  .snackbar small { color:#ddd; font-size:12px; }
  .chooser { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; padding:16px; }
  .chooser.open { display:flex; }
  .chooser .box { background:#fff; border-radius:20px; padding:20px 18px; width:min(100%, 340px); text-align:center; }
  .chooser .ct { font-family:"Jua",sans-serif; font-size:24px; }
  .chooser .cs { font-size:12px; color:var(--gray); margin:6px 0 14px; line-height:1.5; }
  .chooser button { display:block; width:100%; border:0; border-radius:14px; padding:13px; margin-top:8px; font-family:"Jua",sans-serif; font-size:19px; background:var(--yellow); color:var(--ink); cursor:pointer; }
  .chooser button.any { background:#f1f1f1; font-size:16px; }
  .game-box canvas, .tree-box canvas { width:100%; display:block; border-radius:12px; touch-action:none; }
  .game-box .save, .tree-box .save { background:#f1f1f1; color:var(--ink); }
  .tree-box .chips { margin-top:10px; justify-content:center; }
  .tree-box .btns .go:disabled { opacity:.4; }
  .tree-box canvas { max-height:56vh; object-fit:contain; }
  .modal .login.strong { color:var(--red); font-size:14px; font-weight:900; }
  /* 오락실 게임 창: 광장 위에 화면 전체로 띄움 */
  .gamebox { position:fixed; left:0; right:0; top:0; height:100vh; height:100dvh; z-index:30; background:#fbf6ec; display:none; flex-direction:column; }
  .gamebox.open { display:flex; }
  .gamebox .bar { flex:none; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 10px; background:#2a2420; color:#fff; font-family:"Jua",sans-serif; font-size:17px; }
  .gamebox .bar .back { background:#fff; color:#2a2420; border:0; border-radius:10px; padding:6px 10px; font-family:"Jua",sans-serif; font-size:15px; }
  .gamebox .gscore { color:#FFD54A; font-size:15px; min-width:60px; text-align:right; }
  .gamebox iframe { flex:1 1 auto; width:100%; border:0; display:block; background:#fbf6ec; }
</style></head><body><canvas id="game"></canvas>
<div class="top">
  <div class="chip" id="me">들어가는 중</div>
  <div class="chip" id="count">지금 <b>1</b>마리 구경 중</div>
</div>
<button class="chip music" id="music">음악 끄기</button>
<div class="snackbar" id="snackBar"></div>
<div class="chooser" id="chooser">
  <div class="box">
    <div class="ct">누구로 들어갈래?</div>
    <div class="cs">품종은 그 안에서 랜덤이야. 왼쪽 위 이름을 누르면 다시 고를 수 있어</div>
    <button data-kind="dog">강아지</button>
    <button data-kind="cat">고양이</button>
    <button data-kind="" class="any">아무거나</button>
  </div>
</div>
<div class="hint" id="hint">바닥을 누르면 걸어가 · 오락기 앞에 서면 게임</div>
<button class="talk" id="talk">말풍선</button>
<button class="talk act" id="act">행동</button>
<div class="phrases" id="phrases"></div>
<div class="phrases" id="actions"></div>
<button class="snap" id="snap">꾸미고 찍기</button>
<button class="snap" id="tarotBtn">타로 보기</button>
<button class="snap" id="arcadeBtn">게임하기</button>
<button class="snap" id="treeBtn">장식 달기</button>
<div class="gamebox" id="gameBox">
  <div class="bar"><button class="back" id="gameClose">← 광장으로</button><span id="gameTitle">게임</span><span class="gscore" id="gameGive"></span></div>
  <iframe id="gameFrame" title="오락실 게임" allow="vibrate"></iframe>
</div>
<div class="modal" id="treeBox">
  <div class="box tree-box">
    <button class="close" id="treeClose" aria-label="닫기">×</button>
    <canvas id="treeCv" width="600" height="640"></canvas>
    <div class="chips" id="treeKinds"></div>
    <div class="login" id="treeLeft"></div>
    <div class="btns"><button class="go" id="treeHang" disabled>여기에 달기</button></div>
  </div>
</div>
<div class="modal" id="tarot">
  <div class="box tarot-box">
    <button class="close" id="tClose" aria-label="닫기">×</button>
    <div class="tabs"><button data-mode="human">집사 운세</button><button data-mode="pet">우리 애 마음</button></div>
    <div id="tarotArea"></div>
  </div>
</div>
<div class="booth" id="booth">
  <button class="close" id="bClose" aria-label="닫기">×</button>
  <div class="bt">소품 <small>고르면 다른 친구들한테도 보여</small></div>
  <div class="chips" id="accChips"></div>
  <div class="bt">배경</div>
  <div class="chips" id="themeChips"></div>
  <div class="bt">컷</div>
  <div class="chips" id="cutChips"></div>
  <button class="shoot" id="shoot">찍기</button>
  <div class="login">3, 2, 1 하고 찍어. 찍는 사이에 자리 옮기거나 행동 버튼 눌러도 돼</div>
</div>
<div class="modal" id="photo">
  <div class="box">
    <button class="close" id="pClose" aria-label="닫기">×</button>
    <img id="pImg" alt="도둑냥 포토존 사진">
    <div class="btns">
      <button id="pShare">공유하기</button>
      <a class="save" id="pSave">저장하기</a>
    </div>
    <div class="login">저장이 안 되면 사진을 꾹 눌러서 저장해줘</div>
  </div>
</div>
<div class="sheet" id="sheet">  <button class="close" id="close" aria-label="닫기">×</button>
  <div class="row">
    <img id="sImg" alt="">
    <div>
      <div class="name" id="sName"></div>
      <div class="spec" id="sSpec"></div>
      <div class="price" id="sPrice"></div>
      <span class="per" id="sPer"></span>
    </div>
  </div>
  <div class="meta" id="sMeta"></div>
  <div class="say"><b>도둑냥</b><span id="sSay"></span></div>
  <div class="btns">
    <a class="go" id="go" target="_blank" rel="noopener">상세페이지 보기</a>
  </div>
  <div class="login">폐쇄몰이라 구경은 그냥 되고, 구매할 때 로그인만 하면 돼</div>
</div>
<script src="config.js?v=26"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="pets.js?v=26"></script>
<script src="app.js?v=28"></script>
<script src="lab/score.js?v=2"></script>
<script src="extras.js?v=28"></script>
</body>
</html>
